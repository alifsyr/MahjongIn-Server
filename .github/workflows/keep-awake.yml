name: Keep Render Server Awake

on:
  schedule:
    # Runs every 10 minutes to prevent Render free-tier spin-down
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping Health Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP Ping
        run: |
          echo "Pinging MahjongIn-Server health endpoint..."
          curl -s -f -m 30 https://mahjongin-server.onrender.com/health || echo "Ping dispatched"
