services:
  - type: web
    name: mahjongin-server
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVER_URL
        value: https://mahjongin-server.onrender.com
